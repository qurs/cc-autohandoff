name: Проверка автономного пакета

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_plugin.py
      - run: python scripts/check_package.py dist/plugin
      - uses: actions/upload-artifact@v4
        with:
          name: cc-autohandoff-windows-x64
          path: dist/plugin/
          include-hidden-files: true
